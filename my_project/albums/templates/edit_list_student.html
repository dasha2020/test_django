<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-DQvkBjpPgn7RC31MCQoOeC9TI2kdqa4+BSgNMNj8v77fdC77Kj5zpWFTJaaAoMbC" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{% static css_file %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="{% url 'home' %}">Schoolgie</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="{% url 'home' %}">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{% url 'students_main' %}">Students</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'teachers_main' %}">Teachers</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'subjects_main' %}">Subjects</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'classes_main' %}">Classes</a>
              </li>
            </ul>
            <div class="d-flex">
              {% if user.is_authenticated %}
                  <a href="{% url 'logout' %}" class="btn btn-outline-danger ms-2">Log out</a>
              {% else %}
                  <a href="{% url 'login' %}" class="btn btn-outline-primary ms-2">Log in</a>
                  <a href="{% url 'register' %}" class="btn btn-outline-success ms-2">Register</a>
              {% endif %}
            </div>
          </div>
        </div>
    </nav>
    <div class="center_div">
    <h1>List of our students</h1>
    {% for student in students %}
    <div class="vertical">
        <a href="{% url 'edit_student' student_id=student.id %}">{{ student.first_name }} {{ student.last_name }}</a>
    </div>
    <hr>
    {% endfor %}
    <a href="{% url 'home' %}" class="button_students">Back to Home</a>
    </div>
    
</body>
</html>
